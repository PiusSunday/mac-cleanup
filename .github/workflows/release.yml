name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate Payload
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ensure tag commit is on main
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit is not on main. Release is restricted to tags from main."
            exit 1
          fi
      - name: Install test dependencies
        run: brew install shellcheck bats-core
      - name: Run ShellCheck
        run: shellcheck $(find lib -type f -name "*.sh") bin/mac-cleanup
      - name: Run Bats Tests
        run: bats tests/
      - name: Run Smoke Tests
        run: bash tests/smoke_test.sh

  release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      tag: ${{ steps.pack.outputs.tag }}
      asset: ${{ steps.pack.outputs.asset }}
    steps:
      - uses: actions/checkout@v5

      - name: Build immutable release tarball
        id: pack
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREFIX="mac-cleanup-${TAG#v}"
          ASSET="${PREFIX}.tar.gz"

          # Build the tarball from the tree rather than downloading GitHub's
          # generated archive. The generated archive stamps the commit id into
          # its pax header, so its bytes (and sha256) change whenever history is
          # rewritten, which silently invalidates an already-pinned checksum.
          # This tarball is uploaded as a release asset below, and release assets
          # are immutable, so the checksum the tap pins stays valid forever.
          # gzip -n drops the embedded timestamp so the build is reproducible.
          git archive --format=tar --prefix="${PREFIX}/" HEAD | gzip -n > "$ASSET"

          # Refuse to publish a tarball the formula could not install.
          tar -tzf "$ASSET" | grep -qx "${PREFIX}/bin/mac-cleanup"
          tar -tzf "$ASSET" | grep -qx "${PREFIX}/lib/core/core.sh"

          SHA=$(shasum -a 256 "$ASSET" | awk '{print $1}')
          {
            echo "asset=$ASSET"
            echo "sha256=$SHA"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Asset:   $ASSET"
          echo "SHA-256: $SHA"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.pack.outputs.asset }}
          # Never replace the asset on a re-run: the tap pins these exact bytes.
          overwrite_files: false
          fail_on_unmatched_files: true
          body: |
            ## Installation

            ### Homebrew
            ```bash
            brew tap PiusSunday/mac-cleanup
            brew install mac-cleanup
            ```

            ### One-line installer
            ```bash
            curl -sL https://raw.githubusercontent.com/PiusSunday/mac-cleanup/main/install.sh | bash
            ```

            ## Release tarball

            `${{ steps.pack.outputs.asset }}` is attached to this release. It is
            immutable, so the SHA-256 below is stable — it is what the Homebrew
            formula verifies.

            ```
            ${{ steps.pack.outputs.sha256 }}
            ```

  update-tap:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source formula
        uses: actions/checkout@v5
        with:
          path: source

      - name: Check out tap
        uses: actions/checkout@v5
        with:
          repository: PiusSunday/homebrew-mac-cleanup
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Update Formula
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          SHA="${{ needs.release.outputs.sha256 }}"
          ASSET="${{ needs.release.outputs.asset }}"
          # Pin the immutable release asset, never GitHub's generated archive.
          URL="https://github.com/PiusSunday/mac-cleanup/releases/download/${TAG}/${ASSET}"
          FORMULA="tap/Formula/mac-cleanup.rb"

          # The repository formula is the source of truth. Copy it wholesale so
          # that install/test changes propagate to the tap, then pin the asset.
          cp source/Formula/mac-cleanup.rb "$FORMULA"
          sed -i "s|url \".*\"|url \"${URL}\"|" "$FORMULA"
          sed -i "s/sha256 \".*\"/sha256 \"${SHA}\"/" "$FORMULA"

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/mac-cleanup.rb

          # Skip commit if Formula is already up to date (e.g., manually updated)
          if git diff --cached --quiet; then
            echo "Formula already up to date — nothing to commit."
          else
            git commit -m "Bump mac-cleanup to ${TAG}"
            git push
          fi

  notify:
    name: Post Release Summary
    needs: [release, update-tap]
    runs-on: ubuntu-latest
    steps:
      - name: Write Summary
        run: |
          echo "### 🚀 Release Successfully Published!" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.release.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256:** \`${{ needs.release.outputs.sha256 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Homebrew Tap:** Updated automatically via formula push." >> $GITHUB_STEP_SUMMARY
